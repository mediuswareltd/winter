[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videorag"
version = "0.1.0"
description = "Winter: ask questions about your videos and get answers that cite exact timestamps (multimodal RAG with Whisper, CLIP and Claude)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "yt-dlp>=2024.1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
winter = "videorag.cli:main"
videorag = "videorag.cli:main"

[tool.setuptools.packages.find]
include = ["videorag*"]

[tool.setuptools.package-data]
videorag = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's File(...) / Depends(...) defaults are idiomatic
